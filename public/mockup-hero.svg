  <text x="44" y="125" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dashboard</text>

  <rect x="24" y="152" width="10" height="10" rx="2" fill="#71717a" />
  <text x="44" y="161" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Analytics</text>

