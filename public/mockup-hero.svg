    <text x="24" y="132" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MK</text>
    <text x="46" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Mike King</text>
    <text x="46" y="138" fill="#71717a" font-family="system-ui, sans-serif" font-size="9">+$39.99 · 1h ago</text>
