  <rect x="24" y="260" width="10" height="10" rx="2" fill="#71717a" />
  <text x="44" y="269" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Settings</text>

  <!-- Main Content Area -->
  <!-- Top Stat Cards -->
  <g transform="translate(204, 62)">
