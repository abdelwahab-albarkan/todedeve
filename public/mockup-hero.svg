<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="url(#hero-bg)" />
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#27272a" />

  <!-- Window Header -->
  <rect width="800" height="42" fill="#18181b" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27272a" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="250" y="11" width="300" height="20" rx="6" fill="#27272a" />
  <text x="400" y="25" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">app.shipfast.pro/dashboard</text>

