    <rect width="572" height="116" rx="12" fill="#18181b" stroke="#27272a" />
    <rect x="0" y="0" width="572" height="34" rx="12" fill="#202024" />
    <text x="18" y="22" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CUSTOMER</text>
    <text x="220" y="22" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRODUCT</text>
    <text x="380" y="22" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATUS</text>
    <text x="500" y="22" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AMOUNT</text>

    <!-- Row 1 -->
    <text x="18" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Alex Morgan</text>
    <text x="220" y="60" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Starter License v1.0</text>
    <rect x="380" y="48" width="60" height="18" rx="4" fill="#065f46" fill-opacity="0.5" />
    <text x="392" y="61" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">COMPLETED</text>
    <text x="500" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">$39.99</text>

    <!-- Row 2 -->
    <text x="18" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Elena Rossi</text>
    <text x="220" y="96" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Commercial Bundle</text>
    <rect x="380" y="84" width="60" height="18" rx="4" fill="#065f46" fill-opacity="0.5" />
    <text x="392" y="97" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">COMPLETED</text>
    <text x="500" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">$39.99</text>
