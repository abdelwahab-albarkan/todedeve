  <text x="52" y="77" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ShipFast</text>

  <!-- Nav Items -->
  <rect x="14" y="105" width="152" height="32" rx="8" fill="#4f46e5" fill-opacity="0.15" />
