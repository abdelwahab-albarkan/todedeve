      <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">1,429</text>
      <rect x="16" y="66" width="46" height="16" rx="4" fill="#10b981" fill-opacity="0.15" />
      <text x="22" y="78" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">+8.2%</text>
