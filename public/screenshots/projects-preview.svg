    <rect x="20" y="70" width="48" height="16" rx="4" fill="#4f46e5" fill-opacity="0.2" />
    <text x="26" y="82" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9">DESIGN</text>

    <rect x="10" y="122" width="148" height="74" rx="6" fill="#202024" stroke="#27272a" />
    <text x="20" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Add Dark Mode tokens</text>
    <rect x="20" y="154" width="48" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="26" y="166" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9">URGENT</text>
  </g>

  <!-- Col 2: In Progress -->
