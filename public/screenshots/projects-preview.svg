    <rect x="10" y="38" width="148" height="74" rx="6" fill="#202024" stroke="#27272a" />
    <text x="20" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Gumroad checkout test</text>
    <rect x="20" y="70" width="54" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="26" y="82" fill="#34d399" font-family="system-ui, sans-serif" font-size="9">FEATURE</text>

