<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="380" rx="12" fill="#18181b" />
  <rect x="0.5" y="0.5" width="599" height="379" rx="11.5" stroke="#27272a" />
  
  <!-- Header Bar -->
  <rect width="600" height="36" fill="#121215" rx="12 12 0 0" />
