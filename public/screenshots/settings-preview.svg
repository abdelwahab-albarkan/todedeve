<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="380" rx="12" fill="#18181b" />
  <rect x="0.5" y="0.5" width="599" height="379" rx="11.5" stroke="#27272a" />
  
  <!-- Header Bar -->
  <rect width="600" height="36" fill="#121215" rx="12 12 0 0" />
  <circle cx="20" cy="18" r="4" fill="#ef4444" />
  <circle cx="34" cy="18" r="4" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4" fill="#10b981" />
  <text x="300" y="22" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Account Settings & Billing</text>

  <!-- Left Sidebar inside view -->
  <g transform="translate(24, 52)">
    <rect width="130" height="304" rx="8" fill="#141417" stroke="#27272a" />
    <text x="14" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Preferences</text>
    
    <rect x="8" y="46" width="114" height="26" rx="6" fill="#4f46e5" fill-opacity="0.2" />
    <text x="18" y="63" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">General</text>

    <text x="18" y="98" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Profile</text>
    <text x="18" y="130" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Billing & Plan</text>
    <text x="18" y="162" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Security</text>
    <text x="18" y="194" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">API Keys</text>
  </g>

  <!-- Form Area -->
  <g transform="translate(166, 52)">
    <rect width="410" height="304" rx="8" fill="#202024" stroke="#27272a" />
    
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Product Details</text>
    <text x="24" y="50" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Manage the public information for your product</text>
    
    <!-- Field 1 -->
    <text x="24" y="80" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="11">Product Name</text>
    <rect x="24" y="90" width="362" height="32" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="34" y="111" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">ShipFast Pro</text>

    <!-- Field 2 -->
    <text x="24" y="148" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="11">Contact Email</text>
    <rect x="24" y="158" width="362" height="32" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="34" y="179" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">abdelwahabalbarkan2018@gmail.com</text>

    <!-- Field 3: Dark Mode Toggle visual -->
    <text x="24" y="216" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="11">Theme Appearance</text>
    <rect x="24" y="226" width="100" height="28" rx="6" fill="#4f46e5" />
    <text x="42" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Dark (Active)</text>

    <rect x="132" y="226" width="80" height="28" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="156" y="244" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Light</text>

    <!-- Button -->
    <rect x="24" y="272" width="120" height="24" rx="6" fill="#4f46e5" />
    <text x="44" y="288" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Save Changes</text>
  </g>
